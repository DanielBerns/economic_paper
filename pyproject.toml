[project]
name = "economic-graph"
version = "0.1.0"
description = "Empirical Pipeline and Out-of-Sample Benchmark for Dynamic Graph-Agent Economic Models"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "torch>=2.1.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "scipy>=1.11.0",
    "networkx>=3.2.1",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/economic_graph"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []
